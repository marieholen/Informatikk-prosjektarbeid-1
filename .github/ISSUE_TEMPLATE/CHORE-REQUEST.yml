name: Chore Request
description: Request maintenance, refactoring, or other non-feature/non-bug work.
title: "[Chore]: "
labels: ["chore"]
assignees:
  - octocat
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep the project clean and maintainable!  
        Please describe the chore you'd like to propose.

  - type: textarea
    id: description
    attributes:
      label: Chore Description
      description: What needs to be done?
      placeholder: e.g., Update dependencies, refactor module X, improve test coverage.
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why is this chore important or beneficial?
      placeholder: This will reduce technical debt because...
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, links, or details about the request here.
